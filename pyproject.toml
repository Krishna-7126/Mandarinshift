[build-system]
requires = ["setuptools>=65", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "localshift"
version = "0.14.0"
description = "Free, offline-first desktop file converter"
requires-python = ">=3.10"
# Pillow 10+ required for reliable EXIF transpose and WebP support.
# pypdfium2 provides Apache-2.0 / BSD-3 native PDFium inspection and extraction.
# rapidocr-onnxruntime + onnxruntime provide local, privacy-first CPU OCR.
# python-docx provides MIT-licensed offline DOCX generation.
dependencies = [
    "Pillow>=10.0,<14",
    "pypdfium2>=4.30.0",
    "rapidocr-onnxruntime>=1.2.3,<1.3",  # Keep OCR model/API aligned with the audited engine.
    "onnxruntime>=1.17.0",
    "python-docx>=1.1.0",
]

[project.optional-dependencies]
desktop = ["PySide6>=6.7"]
test    = ["pytest>=8.0"]
dev     = ["pytest>=8.0"]
build   = ["PyInstaller==6.22.3"]

[project.scripts]
localshift = "localshift.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths    = ["tests"]
# -ra: show short summary for all non-passing tests.
# -q:  quieter output.
addopts      = "-ra -q"
log_cli      = false
